name: Propose a field case
description: Describe a delivery requirement that Modex could verify.
title: "Field case — "
body:
  - type: textarea
    id: requirement
    attributes:
      label: What should the software do?
      description: Include a public or synthetic example with an expected result.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: How can another engineer verify the outcome?
      description: Include a test, expected output, or steps to reproduce it. Use public data only.
    validations:
      required: true
